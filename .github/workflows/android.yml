name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_apk:
        description: Upload the unsigned APK to Actions artifact storage
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: 'false'
          packages: platform-tools

      - name: Install Android platform, build tools, NDK, and CMake
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'

      - name: Check dictionary accuracy
        run: |
          mkdir -p build/bench-out
          javac -d build/bench-out bench/*.java app/src/main/java/dev/softkeys/ios/EnglishDictionary.java
          java -cp build/bench-out BenchMain . --quick

      - name: Check dictation cleanup
        run: |
          mkdir -p build/cleanup-test
          javac -d build/cleanup-test tests/DictationCleanupTest.java app/src/main/java/dev/softkeys/ios/DictationCleanup.java app/src/main/java/dev/softkeys/ios/DictationNumbers.java app/src/main/java/dev/softkeys/ios/EnglishDictionary.java
          java -cp build/cleanup-test DictationCleanupTest

      - name: Check smart cleanup edits
        run: |
          mkdir -p build/edit-check-test
          javac -d build/edit-check-test tests/SmartEditCheckTest.java app/src/main/java/dev/softkeys/ios/SmartEditCheck.java
          java -cp build/edit-check-test SmartEditCheckTest

      - name: Check dictation keyboard decisions
        run: |
          mkdir -p build/mode-test
          javac -d build/mode-test tests/DictationModeTest.java app/src/main/java/dev/softkeys/ios/DictationMode.java app/src/main/java/dev/softkeys/ios/SpeechSegmenter.java
          java -cp build/mode-test DictationModeTest

      - name: Build unsigned release
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload unsigned build
        if: github.event_name == 'workflow_dispatch' && inputs.upload_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoftKeys-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
